---
name: build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-9
            shortcut: el9
            container-name: almalinux9
          - name: almalinux-10
            shortcut: el10
            container-name: almalinux10
          - name: centos-stream-9
            shortcut: el9s
            container-name: el9stream
          - name: centos-stream-10
            shortcut: el10s
            container-name: el10stream

    name: Build on ${{ matrix.name }}
    container:
      image: quay.io/ovirt/buildcontainer:${{ matrix.container-name }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y --enablerepo=crb*,epel* \
            gcc git java-21-openjdk-devel libcurl-devel libxml2-devel \
            maven redhat-rpm-config rpm-build rpmdevtools ruby ruby-devel \
            rubygem-rake rubygem-rake-compiler rubygem-rspec rubygem-webrick \
            rubygems rubygems-devel

      - name: Set build environment
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "RPM_VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
              echo "PACKAGE_RPM_RELEASE=${BASH_REMATCH[2]}" >> $GITHUB_ENV
            else
              echo "RPM_VERSION=$TAG" >> $GITHUB_ENV
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_SUFFIX=.$(date --utc +%Y%m%d%H%M%S).git$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Build RPM
        run: ./automation/build.sh

      - name: Test install
        run: |
          dnf install -y exported-artifacts/rubygem-ovirt-engine-sdk4*x86_64.rpm
          dnf --downloadonly install -y exported-artifacts/*x86_64.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.shortcut }}
          path: exported-artifacts

  publish-rpms:
    permissions:
      artifact-metadata: read
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ovirt/ovirt-workflows/.github/workflows/publish-rpms.yml@main
    secrets: inherit
