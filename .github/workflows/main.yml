name: Check patch

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: centos-stream-9
            container-name: stream9
          - name: centos-stream-10
            container-name: stream10

    name: ${{ matrix.name }}

    container:
      image: quay.io/centos/centos:${{ matrix.container-name }}

    steps:
    - name: Prepare env
      run: |
           mkdir -p ${GITHUB_WORKSPACE}/tmp.repos/BUILD
           dnf install -y --setopt=tsflags=nodocs autoconf automake createrepo_c gettext-devel git systemd make git rpm-build epel-release

    - uses: ovirt/checkout-action@main

    - name: Make build
      run: |
           export EXTRA_DNF_OPT='--enablerepo=crb*,epel* rubygem-webrick'
           export HOME=${GITHUB_WORKSPACE}
           make -f .copr/Makefile srpm outdir="${GITHUB_WORKSPACE}" spec=rubygem-ovirt-engine-sdk4.spec

    - name: Make and test rpm and gem
      run: |
           export HOME=${GITHUB_WORKSPACE}
           ./automation/check-merged.sh

    - name: Create DNF repository
      run: |
           createrepo_c ${GITHUB_WORKSPACE}/exported-artifacts/

    - name: Test install
      run: |
           dnf install -y ${GITHUB_WORKSPACE}/exported-artifacts/rubygem-ovirt-engine-sdk4*x86_64.rpm
           dnf --downloadonly install -y ${GITHUB_WORKSPACE}/exported-artifacts/*x86_64.rpm

    - name: Upload artifacts
      uses: ovirt/upload-rpms-action@main
      with:
        directory: exported-artifacts
